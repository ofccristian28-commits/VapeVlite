name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'

      - name: Build
        run: gradle setupCIWorkspace build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: VapeVlite
          path: build/libs/*.jar
          if-no-files-found: error
